name: Build VJ Studio (Windows)

on:
  push:
    branches:
      - main
      - "setup/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S VJStudio_v0_1 -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $qtPath = "${{ steps.qt.outputs.qt-path }}"
          $exe = "build/Release/VJStudio.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          & (Join-Path $qtPath "bin/windeployqt.exe") --release --compiler-runtime $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "VJStudio-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VJStudio-Windows-x64
          path: VJStudio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
